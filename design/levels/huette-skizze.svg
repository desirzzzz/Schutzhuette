<svg xmlns="http://www.w3.org/2000/svg" width="680" height="670" viewBox="0 0 680 670" role="img" font-family="Segoe UI, Arial, sans-serif">
<title>Skizze Hütte und Umgebung, von oben (Vertical Slice, 2026-11-08)</title>
