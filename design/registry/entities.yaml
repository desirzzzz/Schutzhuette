# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: solo_mass_valid
    status: active
    source: design/gdd/gegenstandsarten.md
    referenced_by:
      - design/gdd/gegenstandsarten.md
    variables:
      - carry_mode
      - mass_kg
      - max_solo_mass
    output_range: [0, 1]
    expression: "(carry_mode == two_person) OR (mass_kg <= max_solo_mass)"
    notes: "bool; false = Editor-Fehler. Hängt am Tempoverlust 0,01 pro kg aus dem Tragen."
    added: 2026-11-08
    revised: ""
  - name: breaks_on_impact
    status: active
    source: design/gdd/gegenstandsarten.md
    referenced_by:
      - design/gdd/gegenstandsarten.md
    variables:
      - is_fragile
      - state
      - impact_speed
      - break_speed
    output_range: [0, 1]
    expression: "is_fragile AND state == falling AND impact_speed > break_speed"
    notes: "bool; impact_speed = größter Normalanteil der Relativgeschwindigkeit über die Kontaktpunkte eines Kollisionsereignisses, derselbe Messwert wie bei den Geräuschen."
    added: 2026-11-08
    revised: ""
  - name: release_fall_speed
    status: active
    source: design/gdd/gegenstandsarten.md
    referenced_by:
      - design/gdd/gegenstandsarten.md
    variables:
      - gravity
      - hold_height
      - surface_height
    output_range: [0, 5.01]
    expression: "sqrt(2 * gravity * max(0, hold_height - surface_height))"
    notes: "Haltehöhe 1,28 m: Haltepunkt im Tragen 0,2 m über der Mitte der Spielfigur (1,08 m über dem Boden, Kapsel 2 m plus 0,08 m Hautdicke). Vorher [0, 6.11] mit 1,9 m, korrigiert nach Design-Review."
    added: 2026-11-08
    revised: 2026-11-08
  - name: is_warm
    status: active
    source: design/gdd/gegenstandsarten.md
    referenced_by:
      - design/gdd/gegenstandsarten.md
      - design/gdd/saison-ablauf.md
    variables:
      - game_time
      - cooked_time
      - cool_time
    output_range: [0, 1]
    expression: "(game_time - cooked_time) < cool_time"
    notes: "bool; cool_time <= 0 oder fehlend = immer wahr. Die Gäste lesen das Ergebnis."
    added: 2026-11-08
    revised: ""
  - name: warm_fraction
    status: active
    source: design/gdd/gegenstandsarten.md
    referenced_by:
      - design/gdd/gegenstandsarten.md
      - design/gdd/saison-ablauf.md
    variables:
      - game_time
      - cooked_time
      - cool_time
    output_range: [0, 1]
    expression: "clamp(1 - (game_time - cooked_time) / cool_time, 0, 1)"
    notes: "Nur Anzeige (Dampf); cool_time <= 0 oder fehlend = 0."
    added: 2026-11-08
    revised: ""
  - name: chop_mass_balance
    status: active
    source: design/gdd/gegenstandsarten.md
    referenced_by:
      - design/gdd/gegenstandsarten.md
    variables:
      - result_count
      - result_mass_kg
      - source_mass_kg
    output_range: [-80, 80]
    expression: "result_count * result_mass_kg - source_mass_kg"
    notes: "Sollwert 0; Hinweis ab mehr als 10 % der Ausgangsmasse. Holz hacken nutzt sie."
    added: 2026-11-08
    revised: ""
  - name: crew_multiplier
    status: active
    source: design/gdd/interaktion.md
    referenced_by:
      - design/gdd/interaktion.md
    variables:
      - users
      - max_users
      - extra_user_bonus
    output_range: [0, 2]
    expression: "(users >= 1) ? 1 + extra_user_bonus * (min(users, max_users) - 1) : 0"
    notes: "Teamzuschlag; Start 0,5, Kurbel und Generator 0,75; höchstens 2,0 über action_data_valid. Stationen (Seilbahn, Betten, Generator) nutzen sie."
    added: 2026-11-08
    revised: ""
  - name: host_range_ok
    status: active
    source: design/gdd/interaktion.md
    referenced_by:
      - design/gdd/interaktion.md
    variables:
      - target_distance
      - max_server_distance
    output_range: [0, 1]
    expression: "target_distance <= max_server_distance"
    notes: "bool; Abstand von den Augen der Figur zum nächsten Punkt der Station. Einstellregel max_server_distance >= interact_range + max_player_speed * (rtt_budget + interp_delay), Verstoß = Editor-Fehler."
    added: 2026-11-08
    revised: ""
  - name: action_data_valid
    status: active
    source: design/gdd/interaktion.md
    referenced_by:
      - design/gdd/interaktion.md
    variables:
      - duration
      - min_duration
      - max_solo_duration
      - max_users
      - extra_user_bonus
      - max_solo_penalty
    output_range: [0, 1]
    expression: "(duration == 0 OR duration >= min_duration) AND duration <= max_solo_duration AND 1 <= max_users <= 4 AND 0 <= extra_user_bonus <= 1 AND (duration == 0 OR crew_multiplier(max_users) <= max_solo_penalty)"
    notes: "bool; false = Editor-Fehler. Start: min 0,5 s, max 20 s, penalty 2,0."
    added: 2026-11-08
    revised: ""
  - name: game_time
    status: active
    source: design/gdd/saison-ablauf.md
    referenced_by:
      - design/gdd/saison-ablauf.md
      - design/gdd/gegenstandsarten.md
      - design/gdd/interaktion.md
    variables:
      - server_time
      - is_paused
      - pause_time
      - paused_total
    output_range: [0, 999999]
    expression: "(is_paused ? pause_time : server_time) - paused_total"
    notes: "Spielzeit, steht in der Pause solo. Einzige Zeitbasis für Spielregeln mit Zeit (Abkühlen, dt von Handlungen, Brennzeit, Phasen)."
    added: 2026-11-08
    revised: ""
  - name: lobby_slots
    status: active
    source: design/gdd/steam-lobby.md
    referenced_by:
      - design/gdd/steam-lobby.md
    variables:
      - n_spawn
      - max_players
      - spawn_i
    output_range: [0, 4]
    expression: "count{ i in [0, min(n_spawn, max_players)) : spawn_i gesetzt }"
    notes: "Plätze einschließlich Host; Steam-Lobby und Freigabe (PlayerSpawnApproval) nutzen dieselbe Funktion, ersetzt SlotCount. 0 = Hosten verweigert (Konfigurationsfehler)."
    added: 2026-11-08
    revised: ""
  - name: display_name
    status: active
    source: design/gdd/steam-lobby.md
    referenced_by:
      - design/gdd/steam-lobby.md
    variables:
      - raw_name
      - slot
      - name_max
      - name_bytes_max
    output_range: [1, 24]
    expression: "len(clean(raw_name)) >= 1 ? trunc(clean(raw_name), name_max) : 'Spieler ' + (slot + 1)"
    notes: "Länge in Textelementen (Start name_max 16), höchstens 61 Byte UTF-8, kein Textelement zerschnitten; der Host rechnet und verteilt. Das HUD zeigt das Ergebnis als Namensschild."
    added: 2026-11-08
    revised: ""
  - name: season_length
    status: active
    source: design/gdd/saison-ablauf.md
    referenced_by:
      - design/gdd/saison-ablauf.md
      - design/gdd/interaktion.md
    variables:
      - afternoon_length
      - evening_length
      - night_length
    output_range: [1800, 2400]
    expression: "afternoon_length + evening_length + night_length"
    notes: "Nur Spielzeit (ohne Vorbereitung, Bewertung, Upgrades, Pause). Start 600 + 720 + (480..1080) s; night_length = clamp(t_mission_done, night_min, night_max). Interaktion nutzt sie in solo_hold_share."
    added: 2026-11-08
    revised: ""
  - name: phase_progress
    status: active
    source: design/gdd/saison-ablauf.md
    referenced_by:
      - design/gdd/saison-ablauf.md
    variables:
      - phase_elapsed
      - reference_length
    output_range: [0, 1]
    expression: "(reference_length > 0) ? clamp(phase_elapsed / reference_length, 0, 1) : 0"
    notes: "Bezugslänge: Nachmittag afternoon_length, Abend evening_length, Nacht night_min; Zwischenphasen 0. Jeder Spieler rechnet sie aus Phase und phase_start_time selbst. Gäste, Wetter, Ereignisse, HUD lesen sie."
    added: 2026-11-08
    revised: ""
  - name: season_pressure
    status: active
    source: design/gdd/saison-ablauf.md
    referenced_by:
      - design/gdd/saison-ablauf.md
    variables:
      - phase_index
      - p
      - phase_progress
    output_range: [0, 1]
    expression: "(phase_index in {0,1,2}) ? p[phase_index] + (p[phase_index+1] - p[phase_index]) * phase_progress : 0"
    notes: "Gemeinsamer Druck der Saison, Stützwerte p = [0; 0,2; 0,6; 1,0]. Gäste, Wetter, Ereignisse und Musik leiten ihre Eskalation daraus ab, statt eigene Kurven zu bauen."
    added: 2026-11-08
    revised: ""

