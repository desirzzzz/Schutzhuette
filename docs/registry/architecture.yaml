# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: connection_events
    status: active
    api: NetworkManager.OnConnectionEvent
    not: OnClientConnectedCallback / OnClientDisconnectCallback in neuem Code
    adr: docs/architecture/adr-0001-netz-autoritaet-und-physik.md
    reason: "NGO 2.13 empfiehlt es, die alten Callbacks werden abgelöst; vor StartHost abonnieren"
    referenced_by:
      - docs/architecture/adr-0001-netz-autoritaet-und-physik.md
      - docs/architecture/adr-0003-saison-uhr-und-meldungen.md
    added: 2026-11-09
    revised: ""
  - purpose: fast_throw_collision
    status: active
    api: Rigidbody.collisionDetectionMode = ContinuousDynamic nur im Zustand Fällt beim Host, sonst Discrete
    not: ContinuousSpeculative für alle Gegenstände; eigener SphereCast-Vorausblick
    adr: docs/architecture/adr-0001-netz-autoritaet-und-physik.md
    reason: "Innenwände 0,2 m, bei 15 m/s 0,3 m pro Physikschritt; kostet nur, solange etwas fliegt"
    referenced_by:
      - docs/architecture/adr-0001-netz-autoritaet-und-physik.md
    added: 2026-11-09
    revised: ""
  - purpose: network_object_identity
    status: active
    api: NetworkObjectReference / NetworkObjectId
    not: EntityId / InstanceID
    adr: docs/architecture/adr-0001-netz-autoritaet-und-physik.md
    reason: "EntityId ist 8 Byte und lokal; die Netz-Kennung kommt von NGO"
    referenced_by:
      - docs/architecture/adr-0001-netz-autoritaet-und-physik.md
    added: 2026-11-09
    revised: ""
  - purpose: client_to_server_rpc
    status: active
    api: "[Rpc(SendTo.Server, InvokePermission = RpcInvokePermission.Owner)]"
    not: ServerRpc mit RequireOwnership
    adr: docs/architecture/adr-0001-netz-autoritaet-und-physik.md
    reason: "RequireOwnership ist seit NGO 2.7 Obsolete"
    referenced_by:
      - docs/architecture/adr-0001-netz-autoritaet-und-physik.md
    added: 2026-11-09
    revised: ""
  - purpose: item_kind_identity
    status: active
    api: Ein Prefab je Art mit Komponente Item -> ItemKind; NGO erzeugt beim Client dasselbe Prefab
    not: NetworkVariable mit Art-Kennung; ein gemeinsames Prefab für mehrere Arten
    adr: docs/architecture/adr-0002-gegenstandsarten-katalog.md
    reason: "Kostet keine Netzdaten; die Art ist beim Client schon in Awake bekannt, auch für die Masse der Vorhersage-Kopie"
    referenced_by:
      - docs/architecture/adr-0002-gegenstandsarten-katalog.md
    added: 2026-11-09
    revised: ""
  - purpose: wire_id_format
    status: active
    api: "FixedString32Bytes, Muster ^[a-z0-9_]{1,29}$, Präfixe ware_ und beduerfnis_"
    not: Listen-Index, Hash, ScriptableObject-Verweis, Asset-Pfad
    adr: docs/architecture/adr-0002-gegenstandsarten-katalog.md
    reason: "Stabil beim Umsortieren und lesbar im Log; 29 Zeichen passen in FixedString32Bytes"
    referenced_by:
      - docs/architecture/adr-0002-gegenstandsarten-katalog.md
    added: 2026-11-09
    revised: ""
  - purpose: catalog_access
    status: active
    api: CatalogService.Current am NetworkManager-Objekt, Nachschlagetabellen bei jedem Start neu gebaut
    not: Resources.Load; Laufzeit-Tabellen oder serialisiertes Dictionary im ScriptableObject
    adr: docs/architecture/adr-0002-gegenstandsarten-katalog.md
    reason: "Resources.Load gilt als veraltet, Addressables sind nicht installiert; ohne Domain Reload blieben nicht gespeicherte SO-Felder zwischen zwei Play-Durchläufen alt"
    referenced_by:
      - docs/architecture/adr-0002-gegenstandsarten-katalog.md
    added: 2026-11-09
    revised: ""
  - purpose: network_variable_initial_value
    status: active
    api: Startwert vor Spawn() in ein normales Feld, der Host überträgt ihn in OnNetworkSpawn in die NetworkVariable
    not: NetworkVariable vor Spawn() oder erst nach Spawn() schreiben
    adr: docs/architecture/adr-0002-gegenstandsarten-katalog.md
    reason: "OnNetworkSpawn läuft vor dem Bau der Spawn-Nachricht; vorher schreiben loggt eine Warnung, danach kommt der Wert einen Tick zu spät"
    referenced_by:
      - docs/architecture/adr-0002-gegenstandsarten-katalog.md
      - docs/architecture/adr-0003-saison-uhr-und-meldungen.md
    added: 2026-11-09
    revised: ""
  - purpose: game_time_source
    status: active
    api: NetworkManager.ServerTime.Time minus PausedTotal (beim Host während der Pause eingefroren), gelesen über SeasonClock.Current.GameTime
    not: Time.time, Time.deltaTime, NetworkManager.LocalTime, eigene Uhr je Rechner, Ticks
    adr: docs/architecture/adr-0003-saison-uhr-und-meldungen.md
    reason: "ServerTime ist auf allen Rechnern abgeglichen und läuft unskaliert; LocalTime ist eine Vorausschätzung für Eingaben"
    referenced_by:
      - docs/architecture/adr-0003-saison-uhr-und-meldungen.md
    added: 2026-11-09
    revised: ""
  - purpose: solo_pause
    status: active
    api: Time.timeScale = 0 durch SeasonClock, nur ohne Clients
    not: Physics.simulationMode = Script mit eigener Prüfung in jedem System
    adr: docs/architecture/adr-0003-saison-uhr-und-meldungen.md
    reason: "Eine Stelle hält Physik, Bewegung, Animator und Partikel an; NGO rechnet unskaliert und läuft weiter (QQ-05)"
    referenced_by:
      - docs/architecture/adr-0003-saison-uhr-und-meldungen.md
    added: 2026-11-09
    revised: ""
  - purpose: atomic_network_state
    status: active
    api: Zusammengehörige Werte als ein unmanaged struct (INetworkSerializable, IEquatable über alle Felder) in einer NetworkVariable
    not: Mehrere NetworkVariables, die nur zusammen einen Sinn ergeben
    adr: docs/architecture/adr-0003-saison-uhr-und-meldungen.md
    reason: "OnValueChanged feuert je NetworkVariable einzeln in ReadDelta; sonst sieht der Client kurz eine Mischung aus neuen und alten Werten"
    referenced_by:
      - docs/architecture/adr-0003-saison-uhr-und-meldungen.md
    added: 2026-11-09
    revised: ""
  - purpose: owner_body_teleport
    status: active
    api: "[Rpc(SendTo.Owner)]; der Besitzer schaltet den CharacterController aus, setzt die Pose, ruft NetworkTransform.SetState(pos, rot, null, teleportDisabled: false) und schaltet ihn wieder an"
    not: transform.position vom Host setzen; Position setzen bei aktivem CharacterController
    adr: docs/architecture/adr-0003-saison-uhr-und-meldungen.md
    reason: "Der Spielerkörper ist owner-autoritativ (ADR-0001); ohne SetState-Teleport gleitet er bei den anderen quer durch die Hütte"
    referenced_by:
      - docs/architecture/adr-0003-saison-uhr-und-meldungen.md
    added: 2026-11-09
    revised: ""
  - purpose: join_approval
    status: active
    api: JoinRules.Decide (rein) im ConnectionApprovalCallback, Reihenfolge Version, Saison läuft, voll; Grund über response.Reason
    not: Beitritt annehmen und danach wieder trennen; eigene Prüfung je Transport
    adr: docs/architecture/adr-0003-saison-uhr-und-meldungen.md
    reason: "Ein Weg für IP und Steam (ADR-0006); der Client bekommt den Grund wie bei der Versionsprüfung"
    referenced_by:
      - docs/architecture/adr-0003-saison-uhr-und-meldungen.md
    added: 2026-11-09
    revised: ""

