# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: impact_report
    status: active
    pattern: event_bus
    producer: gegenstandsarten
    consumers:
      - geraeusche
      - gaeste
    adr: docs/architecture/adr-0001-netz-autoritaet-und-physik.md
    signal_signature: "ImpactEvents.Reported(ImpactReport) mit Item, Point, ImpactSpeed, Mass, WasFalling, Broke, Other; nur beim Host"
    referenced_by:
      - docs/architecture/adr-0001-netz-autoritaet-und-physik.md
    added: 2026-11-09
    revised: ""
  - contract: client_request
    status: active
    pattern: rpc
    producer: client
    consumers:
      - host
    adr: docs/architecture/adr-0001-netz-autoritaet-und-physik.md
    signal_signature: "[Rpc(SendTo.Server, InvokePermission = RpcInvokePermission.Owner)] von der eigenen Spielfigur; der Host prüft, dann führt er aus"
    referenced_by:
      - docs/architecture/adr-0001-netz-autoritaet-und-physik.md
      - docs/architecture/adr-0003-saison-uhr-und-meldungen.md
    added: 2026-11-09
    revised: ""
  - contract: catalog_lookup
    status: active
    pattern: direct_call
    producer: gegenstandsarten
    consumers:
      - gaeste
      - lager-und-vorraete
      - kochen-und-gerichte
      - geraeusche
    adr: docs/architecture/adr-0002-gegenstandsarten-katalog.md
    signal_signature: "CatalogService.Current.TryGetKind / TryGetWare / TryGetNeed(in FixedString32Bytes id, out Eintrag) -> bool; nur Laufzeit-Code, Prüfregeln und Tests bekommen den ItemCatalog als Parameter"
    referenced_by:
      - docs/architecture/adr-0002-gegenstandsarten-katalog.md
    added: 2026-11-09
    revised: ""
  - contract: item_kind_reference
    status: active
    pattern: direct_call
    producer: gegenstandsarten
    consumers:
      - tragen-und-werfen
      - tragen-zu-zweit
      - holzofen-und-waerme
      - interaktion
      - gaeste
    adr: docs/architecture/adr-0002-gegenstandsarten-katalog.md
    signal_signature: "Item.Kind (ItemKind, schreibgeschützt) am Prefab; Eigenschaften über feste Blöcke mit Enabled (Kind.Fuel, Kind.Chop, Kind.SupplyPack, Kind.Dish, Kind.Fragile, Kind.Tool, Kind.Equipment)"
    referenced_by:
      - docs/architecture/adr-0002-gegenstandsarten-katalog.md
    added: 2026-11-09
    revised: ""
  - contract: season_events
    status: active
    pattern: event_bus
    producer: saison-ablauf
    consumers:
      - holzofen-und-waerme
      - lager-und-vorraete
      - gaeste
      - huettenkasse-und-upgrades
      - nachteinsatz
      - bewertung
    adr: docs/architecture/adr-0003-saison-uhr-und-meldungen.md
    signal_signature: "SeasonEvents.SeasonStarted(int) / PhaseBegan(SeasonPhase, double startGameTime) / NightOver(NightEndReason) / SeasonAborted(); nur beim Host, jeder Zuhörer in try/catch; Start: entfernen, SeasonStarted, aufstellen, PhaseBegan; Abbruch: NightOver(Abort) falls Nacht, SeasonAborted, PhaseBegan(Preparation)"
    referenced_by:
      - docs/architecture/adr-0003-saison-uhr-und-meldungen.md
    added: 2026-11-09
    revised: ""
  - contract: season_clock_read
    status: active
    pattern: shared_resource
    producer: saison-ablauf
    consumers:
      - hud
      - menues
      - interaktion
      - gaeste
      - wetter-und-eskalation
      - ereignisse
    adr: docs/architecture/adr-0003-saison-uhr-und-meldungen.md
    signal_signature: "SeasonClock.Current (null erlaubt): Phase, SeasonNumber, GameTime, IsGameTimeRunning, PhaseElapsed (≥ 0), PhaseProgress, Pressure, Confirmed; Event PhaseChanged auf allen Rechnern, nur für Anzeige, einzige Quelle OnValueChanged"
    referenced_by:
      - docs/architecture/adr-0003-saison-uhr-und-meldungen.md
    added: 2026-11-09
    revised: ""
  - contract: mission_finished
    status: active
    pattern: direct_call
    producer: nachteinsatz
    consumers:
      - saison-ablauf
    adr: docs/architecture/adr-0003-saison-uhr-und-meldungen.md
    signal_signature: "SeasonClock.MissionFinished() beim Host; einziger Weg des Nachteinsatzes zur Uhr, wirkt nur in der Nacht (frühestens bei night_min)"
    referenced_by:
      - docs/architecture/adr-0003-saison-uhr-und-meldungen.md
    added: 2026-11-09
    revised: ""

