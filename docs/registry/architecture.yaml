# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: client_writes_game_state
    status: active
    description: "Clients schreiben keine NetworkVariables und bewegen keine Gegenstände selbst. Sie schicken Wünsche per RPC an den Host."
    why: "Der Host entscheidet (CLAUDE.md Regel 2); zwei Entscheider erzeugen widersprüchlichen Zustand."
    adr: docs/architecture/adr-0001-netz-autoritaet-und-physik.md
    added: 2026-11-09
  - pattern: prediction_changes_state
    status: active
    description: "Vorhersage-Kopien beim Client lösen weder Bruchregel noch Meldedienst noch andere Spiel-Logik aus."
    why: "Vorhersage ist nur optisch; sonst zerbricht beim Client etwas, das beim Host heil bleibt."
    adr: docs/architecture/adr-0001-netz-autoritaet-und-physik.md
    added: 2026-11-09
  - pattern: gameplay_collision_outside_reporter
    status: active
    description: "OnCollisionEnter für Spiel-Logik wertet nur ImpactReporter beim Host aus. Andere Systeme hören an ImpactEvents."
    why: "Ein Messpunkt: Zerbrechen, Geräusche und Gäste rechnen mit demselben impact_speed."
    adr: docs/architecture/adr-0001-netz-autoritaet-und-physik.md
    added: 2026-11-09
  - pattern: effect_rpc_from_despawning_object
    status: active
    description: "Effekte zu einem Gegenstand, der gleich entfernt wird, sendet ein dauerhaftes Objekt (ImpactEffects), nie der Gegenstand selbst."
    why: "Nach Despawn ist IsSpawned false; NetworkObjectReference wirft dann, und das Objekt kann keine RPC mehr senden."
    adr: docs/architecture/adr-0001-netz-autoritaet-und-physik.md
    added: 2026-11-09
  - pattern: runtime_data_object_write
    status: active
    description: "Datenobjekte (ItemKind, WareKind, NeedKind, ItemCatalog, GuestType) werden zur Laufzeit nie geschrieben. Zustand eines einzelnen Gegenstands gehört an den Gegenstand (Feld oder NetworkVariable)."
    why: "Im Editor ändert das Schreiben das Asset dauerhaft, alle Gegenstände derselben Art teilen den Wert, und ohne Domain Reload bleibt er bis zum nächsten Play."
    adr: docs/architecture/adr-0002-gegenstandsarten-katalog.md
    added: 2026-11-09
  - pattern: kind_check_by_id_or_name
    status: active
    description: "Code erkennt eine Art an ihrer Eigenschaft (Kind.Fuel.Enabled), nie an Kennung, Anzeigename oder Prefab-Name."
    why: "Neue Arten sollen ohne Code-Änderung funktionieren (Architektur-Regel 4: Daten in ScriptableObjects)."
    adr: docs/architecture/adr-0002-gegenstandsarten-katalog.md
    added: 2026-11-09
  - pattern: data_object_over_network
    status: active
    description: "Über das Netz gehen keine ScriptableObjects, Asset-Pfade oder Listen-Positionen, nur Kennungen als FixedString32Bytes."
    why: "Listen-Positionen verschieben sich beim Umsortieren still auf eine andere Art; Asset-Verweise lassen sich nicht serialisieren."
    adr: docs/architecture/adr-0002-gegenstandsarten-katalog.md
    added: 2026-11-09
  - pattern: gameplay_rule_on_unity_time
    status: active
    description: "Spielregeln mit Zeit (Brennzeit, Abkühlen, Fortschritt, Geduld) rechnen nie mit Time.time, Time.deltaTime, Time.unscaledTime oder NetworkManager.ServerTime direkt, sondern mit game_time. Darstellung darf Time.deltaTime nutzen."
    why: "Nur game_time steht in der Solo-Pause und ist auf allen Rechnern gleich; sonst läuft eine Regel in der Pause weiter oder beim Client anders."
    adr: docs/architecture/adr-0003-saison-uhr-und-meldungen.md
    added: 2026-11-09
  - pattern: derived_season_values_over_network
    status: active
    description: "Fortschritt der Phase, Druck und verstrichene Zeit gehen nie als NetworkVariable oder RPC übers Netz; jeder Rechner rechnet sie mit SeasonMath."
    why: "Sie ändern sich jedes Bild; übertragen kosteten sie Verkehr in jedem Tick und ruckelten beim Client (GDD Saison-Ablauf, Kriterium 39)."
    adr: docs/architecture/adr-0003-saison-uhr-und-meldungen.md
    added: 2026-11-09
  - pattern: manual_raise_after_network_variable_write
    status: active
    description: "Der Host löst nach dem Setzen einer NetworkVariable nicht zusätzlich von Hand aus, was schon an OnValueChanged hängt (zum Beispiel SeasonClock.PhaseChanged)."
    why: "Der Value-Setter ruft OnValueChanged auch beim Host sofort auf; ein Handaufruf meldet doppelt."
    adr: docs/architecture/adr-0003-saison-uhr-und-meldungen.md
    added: 2026-11-09

